# OKLabs fork: build VoiceInk on a GitHub-hosted macOS runner, sign it with
# Developer ID, notarize + staple app and DMG, publish a GitHub release.
# Stable download URL: https://github.com/kossoy/VoiceInk/releases/latest/download/VoiceInk-oklabs.zip
# Telegram (.oklabs/ci/notify.sh): a message after a published release whose app code
# changed, and one when any job fails. Manual run with telegram_test = one [TEST]
# message, no build.
name: oklabs-release

on:
  push:
    branches: [main]
    # Docs, sync and notification tooling commits need no new build.
    paths-ignore:
      - '**/*.md'
      - '.github/workflows/oklabs-sync.yml'
      - '.oklabs/ci/sync.sh'
      - '.oklabs/ci/notify.sh'
  workflow_dispatch:
    inputs:
      telegram_test:
        description: 'Only send one [TEST] Telegram message (the new-build text for the latest release); no build'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: oklabs-release${{ inputs.telegram_test && '-telegram-test' || '' }}
  cancel-in-progress: false

# Explicit bash: -eo pipefail, so `cmd | tee` fails when cmd fails.
defaults:
  run:
    shell: bash

jobs:
  test:
    name: Tests
    if: ${{ !inputs.telegram_test }}
    uses: ./.github/workflows/oklabs-test.yml

  release:
    name: Build, sign, notarize, release
    needs: test
    if: ${{ !inputs.telegram_test }}
    runs-on: macos-26
    timeout-minutes: 150
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      SIGN_IDENTITY: "Developer ID Application: Oleg Kossoy (LA9V2K2376)"
      TEAM_ID: LA9V2K2376
      WHISPER_TAG: v1.9.5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Toolchain
        run: |
          echo "OUT_DIR=$RUNNER_TEMP/oklabs-out" >> "$GITHUB_ENV"
          sw_vers
          uname -m
          xcodebuild -version
          swift --version
          cmake --version | head -1
          if ! xcrun metal --version >/dev/null 2>&1; then
            echo "Metal toolchain missing; downloading"
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun metal --version | head -2

      - name: Version
        run: |
          PBX=VoiceInk.xcodeproj/project.pbxproj
          # The app target's Release block: MARKETING_VERSION sits right above its bundle id line.
          MV="$(grep -B1 'PRODUCT_BUNDLE_IDENTIFIER = com.prakashjoshipax.VoiceInk;' "$PBX" | sed -n 's/.*MARKETING_VERSION = \(.*\);/\1/p' | head -1)"
          UB="$(awk '/PRODUCT_BUNDLE_IDENTIFIER = com.prakashjoshipax.VoiceInk;/ {print last} /CURRENT_PROJECT_VERSION = / {last=$3}' "$PBX" | tr -d ';' | head -1)"
          [ -n "$MV" ] && [ -n "$UB" ] || { echo "cannot read upstream version"; exit 1; }
          SHA7="${GITHUB_SHA::7}"
          STAMP="$(date -u +%Y%m%d%H%M)"
          git fetch --quiet origin upstream || true
          UPSTREAM_SHA="$(git merge-base HEAD origin/upstream 2>/dev/null || echo unknown)"
          TAG="oklabs-${MV}-${GITHUB_RUN_NUMBER}"
          [ "$GITHUB_RUN_ATTEMPT" = 1 ] || TAG="${TAG}-a${GITHUB_RUN_ATTEMPT}"
          {
            echo "OKLABS_VERSION=${MV}+oklabs.${STAMP}.${SHA7}"
            echo "OKLABS_BUILD=${UB}.${GITHUB_RUN_NUMBER}"
            echo "OKLABS_TAG=${TAG}"
            echo "UPSTREAM_SHA=${UPSTREAM_SHA}"
          } | tee -a "$GITHUB_ENV"

      # Caches are restored and saved explicitly so a later failing step does not
      # throw away a finished whisper build or package checkout.
      - name: Restore whisper.xcframework
        id: whisper-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/VoiceInk-Dependencies
          key: whisper-${{ env.WHISPER_TAG }}-xcode26.6-${{ hashFiles('.oklabs/build-whisper.sh', '.oklabs/ci/whisper_macos_only.py') }}

      - name: Build whisper.xcframework (macOS slice)
        run: bash .oklabs/build-whisper.sh

      - name: Save whisper.xcframework
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/VoiceInk-Dependencies
          key: ${{ steps.whisper-cache.outputs.cache-primary-key }}

      - name: Restore Swift packages
        id: spm-cache
        uses: actions/cache/restore@v4
        with:
          path: .build/SourcePackages
          key: spm-${{ hashFiles('VoiceInk.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies -project VoiceInk.xcodeproj -scheme VoiceInk \
            -clonedSourcePackagesDirPath .build/SourcePackages -onlyUsePackageVersionsFromResolvedFile \
            -skipPackagePluginValidation -skipMacroValidation | tail -40

      - name: Save Swift packages
        if: steps.spm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .build/SourcePackages
          key: ${{ steps.spm-cache.outputs.cache-primary-key }}

      - name: Signing keychain
        env:
          MAC_DEVELOPER_ID_P12: ${{ secrets.MAC_DEVELOPER_ID_P12 }}
          MAC_DEVELOPER_ID_PASSWORD: ${{ secrets.MAC_DEVELOPER_ID_PASSWORD }}
          MAC_CERT_SHA256: ${{ secrets.MAC_CERT_SHA256 }}
          MAC_NOTARY_APPLE_ID: ${{ secrets.MAC_NOTARY_APPLE_ID }}
          MAC_NOTARY_PASSWORD: ${{ secrets.MAC_NOTARY_PASSWORD }}
          MAC_NOTARY_TEAM: ${{ secrets.MAC_NOTARY_TEAM }}
        run: bash .oklabs/ci/keychain.sh setup

      - name: Archive and export (Developer ID)
        run: bash .oklabs/ci/archive.sh

      - name: scribe-bench harness (sign, notarize)
        run: bash .oklabs/ci/bench.sh

      - name: Notarize, staple, package
        run: bash .oklabs/ci/package.sh

      # The newest release on another commit, so a re-run never compares with itself.
      - name: Previous release (for the Telegram message)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --quiet --force --tags origin || true
          echo "PREV_TAG=$(bash .oklabs/ci/notify.sh prev-tag)" | tee -a "$GITHUB_ENV"

      - name: Publish release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D="$OUT_DIR/dist"
          {
            echo "VoiceInk OKLabs fork build \`$OKLABS_VERSION\` (CFBundleVersion $OKLABS_BUILD)."
            echo
            echo "- Fork commit: $GITHUB_SHA"
            echo "- Upstream Beingpax/VoiceInk base: $UPSTREAM_SHA"
            echo "- Signed with Developer ID Application: Oleg Kossoy (LA9V2K2376); app and DMG notarized and stapled."
            echo "- Sparkle is disabled in this fork. Install or update with \`voiceink-oklabs-update\`."
            echo
            echo '```'
            cat "$D/SHA256SUMS"
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$OKLABS_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "VoiceInk OKLabs $OKLABS_VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest \
            "$D/VoiceInk-oklabs.zip" "$D/VoiceInk-oklabs.dmg" "$D/scribe-bench-macos-arm64.zip" "$D/SHA256SUMS"

      - name: Check the stable download URL
        id: urlcheck
        run: |
          T="$(mktemp -d)"; cd "$T"
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/latest/download"
          for i in 1 2 3 4 5 6; do
            curl -fsSLO "$BASE/SHA256SUMS" && grep -q "$(cut -d' ' -f1 "$OUT_DIR/dist/SHA256SUMS" | head -1)" SHA256SUMS && break
            sleep 10
          done
          cmp -s SHA256SUMS "$OUT_DIR/dist/SHA256SUMS" || { echo "error: releases/latest still serves another release" >&2; exit 1; }
          curl -fsSLO "$BASE/VoiceInk-oklabs.zip"
          # Against this build's own sums, so a stale /latest can never pass.
          grep VoiceInk-oklabs.zip "$OUT_DIR/dist/SHA256SUMS" | shasum -a 256 -c -
          echo "### VoiceInk OKLabs $OKLABS_VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"; cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Every published release, even if the download check failed (the text says so).
      # Never fails the job; silent on a push that changed no app code or build input.
      - name: Telegram (new build)
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHECK_OUTCOME: ${{ steps.urlcheck.outcome }}
        run: bash .oklabs/ci/notify.sh release-ok

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ${{ runner.temp }}/oklabs-out/logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove signing keychain
        if: always()
        run: bash .oklabs/ci/keychain.sh cleanup

  # Any failed or cancelled job: one plain-text message with the run URL. No checkout,
  # so it works even when the repository cannot be fetched.
  notify-failure:
    name: Telegram (failure)
    needs: [test, release]
    if: ${{ always() && !inputs.telegram_test && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESULTS: 'Tests: ${{ needs.test.result }}, release: ${{ needs.release.result }}'
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ] || { echo "::warning::Telegram secrets not set"; exit 0; }
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          TEXT="$(printf 'VoiceInk release упал\n%s\ncommit %s (%s)\nПоследний удачный release остаётся latest, если сбой был до publish.\n%s' \
            "$RESULTS" "${GITHUB_SHA::7}" "$GITHUB_EVENT_NAME" "$RUN_URL")"
          curl -sS -m 20 --retry 3 --retry-delay 5 -o /dev/null -w 'Telegram: HTTP %{http_code}\n' \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" --data-urlencode "text=$TEXT" \
            --data-urlencode disable_web_page_preview=true \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" || true

  # The one Telegram path that goes red: a test that delivered nothing must show it.
  telegram-test:
    name: Telegram test message
    if: ${{ inputs.telegram_test }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Send one [TEST] message
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_LABEL: TEST
        run: bash .oklabs/ci/notify.sh test
