# OKLabs fork: ScribeCore unit tests + mock-WebSocket scenarios (`swift test`),
# and an unsigned compile of the app with LOCAL_BUILD OKLABS on feature branches.
# oklabs-release.yml calls this workflow before every release.
name: oklabs-test

on:
  push:
    branches-ignore: [main, upstream]
  workflow_dispatch:
  workflow_call:
    inputs:
      compile_app:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: oklabs-test-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  WHISPER_TAG: v1.9.5

# Explicit bash: -eo pipefail, so `cmd | tee` fails when cmd fails.
defaults:
  run:
    shell: bash

jobs:
  swift-test:
    name: swift test (ScribeCore, mock WebSocket, harness)
    runs-on: macos-26-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          sw_vers
          swift --version
      - name: Build tests
        run: swift build --build-tests 2>&1 | tail -80
      - name: swift test
        run: swift test 2>&1 | tee "$RUNNER_TEMP/swift-test.log"
      - name: Test summary
        if: always()
        run: |
          {
            echo '### swift test'
            echo '```'
            grep -E "^(Test Suite '(All|Selected) tests'|Executed|.*error:|.*failed \()" "$RUNNER_TEMP/swift-test.log" | tail -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  app-compile:
    name: compile app (unsigned, LOCAL_BUILD OKLABS)
    # Release builds on main archive the app anyway; compile-check feature branches only.
    if: github.ref != 'refs/heads/main' || inputs.compile_app
    runs-on: macos-26-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Metal toolchain
        run: |
          if ! xcrun metal --version >/dev/null 2>&1; then xcodebuild -downloadComponent MetalToolchain; fi
      - name: Restore whisper.xcframework
        id: whisper-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/VoiceInk-Dependencies
          key: whisper-${{ env.WHISPER_TAG }}-xcode26.6-${{ hashFiles('.oklabs/build-whisper.sh', '.oklabs/ci/whisper_macos_only.py') }}
      - name: Build whisper.xcframework (macOS slice)
        run: bash .oklabs/build-whisper.sh
      - name: Restore Swift packages
        uses: actions/cache/restore@v4
        with:
          path: .build/SourcePackages
          key: spm-${{ hashFiles('VoiceInk.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-
      - name: xcodebuild build
        run: |
          set -o pipefail
          plutil -remove SUFeedURL VoiceInk/Info.plist
          plutil -remove SUPublicEDKey VoiceInk/Info.plist
          xcodebuild build \
            -project VoiceInk.xcodeproj -scheme VoiceInk -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -clonedSourcePackagesDirPath .build/SourcePackages \
            -onlyUsePackageVersionsFromResolvedFile -skipPackagePluginValidation -skipMacroValidation \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM= \
            CODE_SIGN_ENTITLEMENTS="$PWD/VoiceInk/VoiceInk.local.entitlements" \
            'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) LOCAL_BUILD OKLABS' \
            > "$RUNNER_TEMP/build.log" 2>&1 || {
              grep -E 'error:|warning: .*OKLabs' "$RUNNER_TEMP/build.log" | head -80
              tail -60 "$RUNNER_TEMP/build.log"
              exit 1
            }
          grep -E 'warning: .*/OKLabs/|warning: .*(TranscriptionPipeline|TranscriptionSession|StreamingTranscriptionService|CursorPaster|ElevenLabsProvider|CustomVocabularyService|TranscriptionOutputFilter|VoiceInk\.swift)' "$RUNNER_TEMP/build.log" | sort -u | head -40 || true
          tail -3 "$RUNNER_TEMP/build.log"
